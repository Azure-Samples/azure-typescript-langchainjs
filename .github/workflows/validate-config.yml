name: Validate Config Consistency

on:
  push:
    branches: [main]
    paths:
      - 'sample.env'
      - 'infra/**'
      - 'packages-v1/**/azure/llm.ts'
      - 'packages-v1/**/azure/embeddings.ts'
      - 'packages/**/config/*.ts'
      - 'scripts/validate-config.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'sample.env'
      - 'infra/**'
      - 'packages-v1/**/azure/llm.ts'
      - 'packages-v1/**/azure/embeddings.ts'
      - 'packages/**/config/*.ts'
      - 'scripts/validate-config.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-config:
    name: Check sample.env ↔ Bicep ↔ Source consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Validate config consistency
        run: node scripts/validate-config.mjs
